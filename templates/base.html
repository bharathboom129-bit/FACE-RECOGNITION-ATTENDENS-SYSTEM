<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Classroom Academic Web Portal{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-card: rgba(26, 29, 39, 0.75);
            --bg-card-hover: rgba(35, 39, 52, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #00aeff;
            --accent-green: #2ec4b6;
            --accent-yellow: #ff9f1c;
            --accent-red: #e71d36;
            --text-main: #f0f2f5;
            --text-muted: #8a94a6;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 174, 255, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(231, 29, 54, 0.05) 0%, transparent 40%);
        }

        .navbar-custom {
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
        }

        .nav-link-custom {
            color: var(--text-muted);
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link-custom:hover, .nav-link-custom.active {
            color: #ffffff;
            background: rgba(0, 174, 255, 0.12);
            border: 1px solid rgba(0, 174, 255, 0.3);
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.25s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .kpi-card {
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }

        .kpi-blue::before { background-color: var(--accent-blue); }
        .kpi-green::before { background-color: var(--accent-green); }
        .kpi-yellow::before { background-color: var(--accent-yellow); }
        .kpi-red::before { background-color: var(--accent-red); }

        .table-custom {
            color: #ffffff !important;
            --bs-table-color: #ffffff !important;
            --bs-table-bg: transparent !important;
            --bs-table-border-color: rgba(255, 255, 255, 0.15) !important;
            margin-bottom: 0;
        }

        .table-custom th {
            background: rgba(30, 34, 46, 0.95) !important;
            color: #00aeff !important;
            font-weight: 700;
            border-bottom: 2px solid rgba(0, 174, 255, 0.4) !important;
            padding: 14px 16px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .table-custom td {
            background: transparent !important;
            color: #ffffff !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
            padding: 14px 16px;
            vertical-align: middle;
        }

        .table-custom tr:hover td {
            background: rgba(255, 255, 255, 0.03) !important;
        }

        .form-label-custom {
            color: #00aeff !important;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-custom, .form-select-custom {
            background-color: #141722 !important;
            color: #ffffff !important;
            border: 1px solid rgba(0, 174, 255, 0.3) !important;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .form-control-custom::placeholder {
            color: #9aa5b8 !important;
            opacity: 0.9;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            border-color: #00aeff !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 174, 255, 0.25) !important;
            background-color: #1a1e2d !important;
            color: #ffffff !important;
        }

        .badge-regular {
            background: rgba(46, 196, 182, 0.15);
            color: #2ec4b6;
            border: 1px solid rgba(46, 196, 182, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-defaulter {
            background: rgba(231, 29, 54, 0.15);
            color: #e71d36;
            border: 1px solid rgba(231, 29, 54, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .btn-neon-blue {
            background: linear-gradient(135deg, #00aeff, #0077ff);
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 8px 18px;
            box-shadow: 0 4px 14px rgba(0, 174, 255, 0.35);
            transition: all 0.2s ease;
        }

        .btn-neon-blue:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 174, 255, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center font-weight-bold" href="/">
                <i class="fa-solid fa-graduation-cap me-2 text-info fs-3"></i>
                <span class="fs-4 fw-bold text-white">Smart Classroom <span class="text-info">AI Portal</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fa-solid fa-chart-pie me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/attendance' %}active{% endif %}" href="/attendance">
                            <i class="fa-solid fa-camera me-1"></i> Live Attendance
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/students' %}active{% endif %}" href="/students">
                            <i class="fa-solid fa-user-graduate me-1"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/subjects' %}active{% endif %}" href="/subjects">
                            <i class="fa-solid fa-book-open me-1"></i> Subjects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/reports' %}active{% endif %}" href="/reports">
                            <i class="fa-solid fa-file-pdf me-1"></i> Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom {% if request.path == '/settings' %}active{% endif %}" href="/settings">
                            <i class="fa-solid fa-gear me-1"></i> Settings
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted py-3 border-top border-secondary mt-auto" style="background: rgba(15, 17, 23, 0.9);">
        <div class="container">
            <small>&copy; 2026 Smart Classroom Biometric Attendance & Multi-Dimensional Analytics Platform</small>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
